name: Package skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validators
        run: python -m pip install --disable-pip-version-check jsonschema PyYAML ruff
      - name: Validate schema, semantic fixtures, adapters, and CLI fallback
        run: |
          python -m unittest discover -s tests -p 'test_analysis.py' -v
          python -m compileall -q workout-remotion-editor/scripts
          ruff check workout-remotion-editor/scripts tests
          git diff --check HEAD^ HEAD
      - name: Validate skill metadata
        run: |
          python - <<'PY'
          import pathlib, re, yaml
          root = pathlib.Path("workout-remotion-editor")
          text = (root / "SKILL.md").read_text()
          match = re.match(r"^---\n(.*?)\n---\n", text, re.S)
          assert match, "SKILL.md frontmatter is missing"
          metadata = yaml.safe_load(match.group(1))
          assert set(metadata) == {"name", "description"}
          assert metadata["name"] == root.name
          assert len(metadata["name"]) <= 64
          assert re.fullmatch(r"[a-z0-9-]+", metadata["name"])
          assert (root / "agents/openai.yaml").is_file()
          assert (root / "references/remotion-skill-routing.md").is_file()
          assert (root / "references/retention-and-shareability.md").is_file()
          PY
      - name: Package skill.zip
        run: |
          rm -f skill.zip
          cd workout-remotion-editor
          zip ../skill.zip SKILL.md
          zip -r ../skill.zip agents references scripts assets -x '**/__pycache__/*' '*.pyc'
          cd ..
          zip -j skill.zip LICENSE THIRD_PARTY_NOTICES.md
          unzip -t skill.zip
          test "$(unzip -Z1 skill.zip | head -1)" = "SKILL.md"
      - uses: actions/upload-artifact@v4
        with:
          name: workout-remotion-editor-skill
          path: skill.zip
          if-no-files-found: error
