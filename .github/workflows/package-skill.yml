name: Package skill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validators
        run: python -m pip install --disable-pip-version-check jsonschema PyYAML
      - name: Validate JSON Schema and Python
        run: |
          python -m json.tool workout-remotion-editor/scripts/analysis-schema.json >/dev/null
          python -m py_compile workout-remotion-editor/scripts/validate_analysis.py
      - name: Smoke-test analysis validator
        run: |
          cat > /tmp/valid-analysis.json <<'JSON'
          {"schema_version":"2.2","project":{"title":"CI fixture","mode":"quick"},"sources":[{"id":"source-1","path":"fixture.mp4","duration":10}],"segments":[{"id":"segment-1","source_id":"source-1","start":1,"end":5,"type":"exercise","confidence":"high"}],"repetitions":[{"id":"rep-1","source_id":"source-1","segment_id":"segment-1","start":2,"end":3,"complete":true,"confidence":"high"}]}
          JSON
          python workout-remotion-editor/scripts/validate_analysis.py /tmp/valid-analysis.json
          python - <<'PY'
          import json
          path = "/tmp/valid-analysis.json"
          data = json.load(open(path))
          data["segments"][0]["end"] = 11
          json.dump(data, open("/tmp/invalid-analysis.json", "w"))
          PY
          if python workout-remotion-editor/scripts/validate_analysis.py /tmp/invalid-analysis.json; then
            echo "invalid fixture unexpectedly passed" >&2
            exit 1
          fi
      - name: Validate skill metadata
        run: |
          python - <<'PY'
          import pathlib, re, yaml
          root = pathlib.Path("workout-remotion-editor")
          text = (root / "SKILL.md").read_text()
          match = re.match(r"^---\n(.*?)\n---\n", text, re.S)
          assert match, "SKILL.md frontmatter is missing"
          metadata = yaml.safe_load(match.group(1))
          assert set(metadata) == {"name", "description"}
          assert metadata["name"] == root.name
          assert len(metadata["name"]) <= 64
          assert re.fullmatch(r"[a-z0-9-]+", metadata["name"])
          assert (root / "agents/openai.yaml").is_file()
          assert (root / "references/remotion-skill-routing.md").is_file()
          PY
      - name: Package skill.zip
        run: |
          cd workout-remotion-editor
          zip -r ../skill.zip . -x '**/__pycache__/*' '*.pyc'
          cd ..
          unzip -t skill.zip
          test "$(unzip -Z1 skill.zip | head -1)" = "SKILL.md"
      - uses: actions/upload-artifact@v4
        with:
          name: workout-remotion-editor-skill
          path: skill.zip
          if-no-files-found: error
